name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Lint BrightScript and SceneGraph XML
        run: npm run lint
      - name: Package side-loadable zip
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: siku
          path: out/siku.zip
