# Publishes a side-loadable zip as a GitHub Release.
# Runs on every push to the default branch: reads the version from the manifest
# (major.minor.build) and, if no release with that tag exists yet, builds the zip,
# creates the tag and publishes the release. Bumping build_version in the manifest
# is therefore all it takes to ship a new build.
name: Release

on:
  push:
    branches:
      - ccr-26864aeb-leveko
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version from the manifest
        id: version
        run: |
          major=$(grep '^major_version=' manifest | cut -d= -f2)
          minor=$(grep '^minor_version=' manifest | cut -d= -f2)
          build=$(grep '^build_version=' manifest | cut -d= -f2 | sed 's/^0*//')
          echo "tag=v${major}.${minor}.${build:-0}" >> "$GITHUB_OUTPUT"
      - name: Skip if this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.exists.outputs.released == 'false'
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        if: steps.exists.outputs.released == 'false'
      - run: npm run lint
        if: steps.exists.outputs.released == 'false'
      - run: npm run package
        if: steps.exists.outputs.released == 'false'
      - name: Name the zip after the version
        if: steps.exists.outputs.released == 'false'
        run: cp out/siku.zip "out/siku-${{ steps.version.outputs.tag }}.zip"
      - name: Build the release notes from CHANGELOG.md
        if: steps.exists.outputs.released == 'false'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          {
            echo "## What's new"
            echo
            # The section for this version: from its "## vX.Y.Z" heading up to the next "## " heading.
            awk -v tag="$tag" '
              $0 ~ "^## " { if (found) exit; if ($2 == tag) { found = 1; next } }
              found { print }
            ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}'
            echo
            echo "## Install"
            echo
            echo "1. Download the \`.zip\` below (do not unzip it)."
            echo "2. With developer mode on, open \`http://<roku-ip>\` in a browser and sign in as \`rokudev\`."
            echo "3. Click **Upload**, pick the zip, then **Install** (or **Replace** to update)."
            echo ""
            echo "First time? The [step-by-step guide](https://github.com/${GITHUB_REPOSITORY}#install-on-your-roku-side-load) shows how to turn on developer mode."
          } > out/release-notes.md
          if ! grep -q '^- ' out/release-notes.md; then
            echo "::warning::CHANGELOG.md has no section for $tag; add one so the release has notes."
          fi
          if ! grep -q -- "\*\*$tag\*\*" .claude/skills/roku-brightscript/SKILL.md; then
            echo "::warning::.claude/skills/roku-brightscript/SKILL.md has no Release log entry for $tag; record what this build taught."
          fi
          cat out/release-notes.md
      - uses: softprops/action-gh-release@v2
        if: steps.exists.outputs.released == 'false'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Siku ${{ steps.version.outputs.tag }}
          files: out/siku-${{ steps.version.outputs.tag }}.zip
          body_path: out/release-notes.md
